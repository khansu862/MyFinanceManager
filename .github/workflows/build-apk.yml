name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyFinanceManagerAndroid/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip Android project
        run: |
          mkdir -p project
          ZIP=$(find . -name '*GitHubBuild*.zip' -o -name '*Android*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP" -d project
          find project -name settings.gradle -print

      - name: Build debug APK
        run: |
          PROJECT=$(find project -name settings.gradle -printf '%h\n' | head -n 1)
          test -n "$PROJECT"
          cd "$PROJECT"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing; cannot build with ./gradlew"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFinanceManager-APK
          path: project/**/build/outputs/apk/debug/*.apk
